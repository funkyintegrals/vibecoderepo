<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090c14" />
  <meta name="description" content="A small playground for bold ideas, fun experiments, and things worth playing." />
  <title>Vibe Code Repo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090c14;
      --text: #f4f6fb;
      --muted: #a4aec2;
      --line: rgba(255, 255, 255, 0.11);
      --lime: #c4fa79;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(104, 92, 220, 0.16), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--lime); outline-offset: 4px; border-radius: 6px; }

    .page {
      width: min(880px, calc(100% - 40px));
      margin-inline: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header span { color: var(--muted); font-weight: 500; }

    main { flex: 1; padding: 72px 0 56px; }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.6rem, 8vw, 4.4rem);
      line-height: 1;
      letter-spacing: -0.06em;
      font-weight: 780;
    }

    .intro {
      max-width: 520px;
      margin: 0 0 64px;
      color: var(--muted);
      font-size: 1.08rem;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 0.95rem;
      font-weight: 650;
      color: var(--muted);
    }

    .project-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    .project-list li { border-bottom: 1px solid var(--line); }

    .project {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 4px;
      transition: padding-left .18s ease, color .18s ease;
    }

    .project:hover { padding-left: 12px; color: var(--lime); }

    .project-name { font-size: 1.15rem; font-weight: 650; letter-spacing: -0.02em; }

    .project-desc { color: var(--muted); font-size: .92rem; text-align: right; }

    footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 18px;
      padding: 22px 0 28px;
      border-top: 1px solid var(--line);
      color: #7f8aa0;
      font-size: .82rem;
    }

    footer a { color: #bac3d4; transition: color .18s ease; }
    footer a:hover { color: var(--lime); }

    @media (max-width: 560px) {
      main { padding-top: 48px; }
      .project { flex-direction: column; gap: 2px; }
      .project-desc { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>vibe code <span>repo</span></header>

    <main>
      <h1>Ideas in motion.</h1>
      <p class="intro">
        A small playground for curious experiments and unexpected ideas. Best explored hands-on.
      </p>

      <h2>Projects</h2>
      <ul class="project-list">
        <li>
          <a class="project" href="./elementfight/">
            <span class="project-name">ElementFight</span>
            <span class="project-desc">A turn-based blade battle game.</span>
          </a>
        </li>
        <!-- Add new projects by copying the <li> above -->
      </ul>
    </main>

    <footer>
      <span>Vibe Code Repo</span>
      <a href="https://github.com/funkyintegrals/vibecoderepo" target="_blank" rel="noreferrer">Code on GitHub ↗</a>
    </footer>
  </div>
</body>
</html>

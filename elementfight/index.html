
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElementFight</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0e1220;
      --panel: #171d2d;
      --panel-2: #1d2538;
      --accent: #7c8cff;
      --accent-2: #34d7b7;
      --danger: #ff5f7e;
      --warning: #ffbf69;
      --text: #ffffff;
      --muted: #d0d8f2;
      --border: rgba(255, 255, 255, 0.18);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at top,
          rgba(124, 140, 255, 0.24),
          transparent 30%
        ),
        linear-gradient(180deg, #090d18, var(--bg));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    button {
      font: inherit;
    }

    .game-shell {
      width: min(1000px, 92vw);
      background: rgba(23, 29, 45, 0.96);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      padding: 24px;
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.8rem;
      color: var(--muted);
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
    }

    h2 {
      font-size: 1.35rem;
      line-height: 1.25;
    }

    h3 {
      font-size: 1.05rem;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .secondary,
    .action-button,
    .blade-button {
      border: none;
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      transition:
        transform 0.15s ease,
        filter 0.15s ease,
        opacity 0.15s ease;
    }

    .secondary:hover:not(:disabled),
    .action-button:hover:not(:disabled),
    .blade-button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      padding: 11px 17px;
      min-height: 46px;
      font-weight: 700;
    }

    .battle-area {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 18px;
    }

    .fighter-panel,
    .center-panel {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      min-width: 0;
    }

    .fighter-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .fighter-header h2 {
      margin-bottom: 0;
    }

    .blade-badge {
      background: rgba(124, 140, 255, 0.15);
      border: 1px solid rgba(124, 140, 255, 0.4);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.82rem;
      line-height: 1.3;
      text-align: center;

      /* Allow the badge to wrap instead of overflowing. */
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(80px, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .stats > div {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      min-width: 0;
    }

    .stats span {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 4px;
    }

    .stats strong {
      display: block;
      color: #ffffff;
      font-size: 1.15rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .portrait {
      display: grid;
      place-items: center;
      min-height: 140px;
      border-radius: 16px;
      font-size: 4rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
    }

    .center-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .battle-status {
      background: rgba(52, 215, 183, 0.12);
      border: 1px solid rgba(52, 215, 183, 0.5);
      border-radius: 12px;
      padding: 14px 16px;
      min-height: 80px;
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.5;

      /* Complete text can wrap. */
      white-space: normal;
      overflow-wrap: anywhere;
      overflow: visible;
    }

    .turn-log-wrap {
      margin-top: 18px;
      min-width: 0;
    }

    /*
     * BATTLE LOG
     *
     * Only the two newest messages are rendered by JavaScript.
     * Messages are allowed to wrap onto multiple lines.
     * Nothing is replaced with "..." and nothing is cut off.
     */
    .battle-log {
      margin: 0;
      padding: 0;
      list-style: none;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;

      min-height: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .battle-log li {
      padding: 9px 11px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9px;

      /*
       * Important:
       * Allow complete messages to wrap.
       */
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;

      /*
       * Never use ellipses.
       */
      text-overflow: clip;

      /*
       * Do not clip the contents of a message.
       */
      overflow: visible;

      animation: logRollUp 0.25s ease-out;
    }

    @keyframes logRollUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .control-panel {
      margin-top: 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .blade-grid,
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(100px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .blade-button,
    .action-button {
      padding: 13px 14px;
      min-height: 50px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);

      /*
       * Button text may wrap if necessary.
       */
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.35;
      font-weight: 700;
    }

    .blade-button.active {
      background: rgba(124, 140, 255, 0.2);
      border-color: rgba(124, 140, 255, 0.6);
    }

    .action-button[data-action="attack"] {
      background: rgba(255, 95, 126, 0.12);
    }

    .action-button[data-action="defend"] {
      background: rgba(52, 215, 183, 0.12);
    }

    .action-button[data-action="special"] {
      background: rgba(255, 191, 105, 0.14);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
      filter: grayscale(0.35);
    }

    button:focus-visible {
      outline: 3px solid rgba(124, 140, 255, 0.75);
      outline-offset: 2px;
    }

    .status-line {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      text-align: center;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .game-shell {
        width: 94vw;
        padding: 20px;
      }

      .battle-area {
        grid-template-columns: 1fr;
      }

      .blade-grid,
      .action-grid {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }

      .title-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .secondary {
        width: 100%;
      }
    }

    @media (max-width: 420px) {
      body {
        font-size: 15px;
      }

      .game-shell {
        width: 96vw;
        padding: 15px;
        border-radius: 16px;
      }

      .fighter-panel,
      .center-panel,
      .control-panel {
        padding: 15px;
        border-radius: 15px;
      }

      .fighter-header {
        flex-direction: column;
        align-items: stretch;
      }

      .blade-badge {
        align-self: flex-start;
      }

      .blade-grid,
      .action-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .blade-button,
      .action-button {
        min-height: 52px;
        padding: 11px 9px;
        font-size: 0.92rem;
      }

      .battle-log {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>

  <main class="game-shell">

    <header class="title-bar">
      <div>
        <p class="eyebrow">Turn-based battle</p>
        <h1>ElementFight</h1>
      </div>

      <button id="restartBtn" class="secondary">
        New Battle
      </button>
    </header>

    <section class="battle-area">

      <!-- PLAYER -->
      <div class="fighter-panel player-panel">

        <div class="fighter-header">
          <h2>Player</h2>

          <span id="playerBlade" class="blade-badge">
            Blade: Time
          </span>
        </div>

        <div class="stats">
          <div>
            <span>HP</span>
            <strong id="playerHp">1000</strong>
          </div>

          <div>
            <span>Focus</span>
            <strong id="playerFocus">0 / 10</strong>
          </div>
        </div>

        <div class="portrait player-portrait">
          ⚔️
        </div>

      </div>

      <!-- CENTER -->
      <div class="center-panel">

        <div id="battleStatus" class="battle-status">
          Choose your move.
        </div>

        <div class="turn-log-wrap">

          <h3>Battle Log</h3>

          <ul id="battleLog" class="battle-log"></ul>

        </div>

      </div>

      <!-- ENEMY -->
      <div class="fighter-panel enemy-panel">

        <div class="fighter-header">
          <h2>Enemy</h2>

          <span id="enemyBlade" class="blade-badge">
            Blade: ???
          </span>
        </div>

        <div class="stats">
          <div>
            <span>HP</span>
            <strong id="enemyHp">1000</strong>
          </div>

          <div>
            <span>Focus</span>
            <strong id="enemyFocus">0 / 10</strong>
          </div>
        </div>

        <div class="portrait enemy-portrait">
          ⚔️
        </div>

      </div>

    </section>

    <!-- CONTROLS -->
    <section class="control-panel">

      <h3>Choose a blade</h3>

      <div class="blade-grid" id="bladeGrid">

        <button
          class="blade-button active"
          data-blade="Time"
          type="button"
        >
          Time
        </button>

        <button
          class="blade-button"
          data-blade="Electricity"
          type="button"
        >
          Electricity
        </button>

      </div>

      <p id="turnInfo" class="status-line">
        Your turn
      </p>

      <h3>Actions</h3>

      <div class="action-grid">

        <button
          class="action-button"
          data-action="attack"
          type="button"
        >
          Attack Skill
        </button>

        <button
          class="action-button"
          data-action="defend"
          type="button"
        >
          Defend Skill
        </button>

        <button
          class="action-button"
          data-action="special"
          type="button"
        >
          Ultimate
        </button>

      </div>

    </section>

  </main>

  <script>
    'use strict';

    /*
     * ============================================================
     * GAME DATA
     * ============================================================
     */

    const MAX_HP = 1000;
    const BASE_DEFENSE = 40;
    const MAX_FOCUS = 10;

    const BLADES = {
      Time: {
        attackName: 'Chrono Slash',
        defendName: 'Temporal Guard',
        specialName: 'Age of Stillness',

        attackDamage: 100,

        ultimateHitCount: 10,
        ultimateDamagePerHit: 50,
        ultimateCritDamagePerHit: 100,

        ultimateCritChance: 0.5,

        focusCap: MAX_FOCUS
      },

      Electricity: {
        attackName: 'Volt Arc',
        defendName: 'Static Impulse',
        specialName: 'Thunderstorm',

        attackDamage: 80,
        critDamage: 160,

        critChance: 0.25,

        critBoostAttacks: 2,

        ultimateDamage: 300,

        focusCap: MAX_FOCUS
      }
    };


    /*
     * ============================================================
     * GAME STATE
     * ============================================================
     */

    function createFighter(blade) {
      return {
        hp: MAX_HP,
        def: BASE_DEFENSE,
        focus: 0,

        blade,

        isDefending: false,

        actionsThisTurn: 1,
        extraTurnCharges: 0,

        guaranteedCrits: 0,

        timeDefendLocked: false
      };
    }

    const state = {
      player: createFighter('Time'),
      enemy: createFighter('Electricity'),

      turn: 1,

      phase: 'player',

      isBattleOver: false,

      log: []
    };


    /*
     * ============================================================
     * DOM
     * ============================================================
     */

    const playerHpEl =
      document.getElementById('playerHp');

    const playerFocusEl =
      document.getElementById('playerFocus');

    const enemyHpEl =
      document.getElementById('enemyHp');

    const enemyFocusEl =
      document.getElementById('enemyFocus');

    const playerBladeEl =
      document.getElementById('playerBlade');

    const enemyBladeEl =
      document.getElementById('enemyBlade');

    const battleStatusEl =
      document.getElementById('battleStatus');

    const battleLogEl =
      document.getElementById('battleLog');

    const restartBtn =
      document.getElementById('restartBtn');

    const turnInfoEl =
      document.getElementById('turnInfo');

    const bladeButtons =
      [...document.querySelectorAll('.blade-button')];

    const actionButtons =
      [...document.querySelectorAll('.action-button')];


    /*
     * ============================================================
     * LOGGING
     * ============================================================
     */

    function addLog(message) {
      /*
       * Keep only the newest two messages.
       *
       * The messages themselves are never shortened.
       */
      state.log.unshift(message);

      if (state.log.length > 2) {
        state.log.length = 2;
      }

      renderLog();
    }


    function renderLog() {
      battleLogEl.replaceChildren();

      state.log
        .slice()
        .reverse()
        .forEach(message => {
          const li = document.createElement('li');

          /*
           * textContent guarantees the complete message is
           * inserted without HTML interpretation.
           */
          li.textContent = message;

          battleLogEl.appendChild(li);
        });
    }


    /*
     * ============================================================
     * UTILITIES
     * ============================================================
     */

    function clamp(value, min, max) {
      return Math.min(
        Math.max(value, min),
        max
      );
    }


    function randomBlade() {
      const blades = Object.keys(BLADES);

      return blades[
        Math.floor(
          Math.random() * blades.length
        )
      ];
    }


    function getFighterName(fighter) {
      return fighter === state.player
        ? 'Player'
        : 'Enemy';
    }


    function getBladeStats(fighter) {
      return BLADES[fighter.blade];
    }


    /*
     * ============================================================
     * FOCUS
     * ============================================================
     */

    function gainFocus(fighter, amount = 1) {
      const stats = getBladeStats(fighter);

      fighter.focus = clamp(
        fighter.focus + amount,
        0,
        stats.focusCap
      );
    }


    /*
     * ============================================================
     * DAMAGE
     * ============================================================
     */

    function applyDefense(damage, defender) {
      let finalDamage = Math.max(
        1,
        damage - defender.def
      );

      if (defender.isDefending) {
        finalDamage = Math.max(
          1,
          Math.floor(finalDamage * 0.5)
        );
      }

      return finalDamage;
    }


    function normalAttack(attacker, defender) {
      const stats = getBladeStats(attacker);

      let rawDamage = stats.attackDamage;
      let critical = false;

      if (attacker.blade === 'Electricity') {

        if (attacker.guaranteedCrits > 0) {
          critical = true;

          attacker.guaranteedCrits -= 1;
        }
        else if (
          Math.random() < stats.critChance
        ) {
          critical = true;
        }

        if (critical) {
          rawDamage = stats.critDamage;
        }
      }

      const damage =
        applyDefense(
          rawDamage,
          defender
        );

      defender.hp = clamp(
        defender.hp - damage,
        0,
        MAX_HP
      );

      const name =
        getFighterName(attacker);

      const criticalText =
        critical ? ' CRITICAL!' : '';

      addLog(
        `${name} — ${stats.attackName} deals ${damage} damage.${criticalText}`
      );

      gainFocus(attacker);

      defender.isDefending = false;

      return damage;
    }


    /*
     * ============================================================
     * SPECIALS
     * ============================================================
     */

    function useUltimate(attacker, defender) {
      const stats = getBladeStats(attacker);
      const name = getFighterName(attacker);

      if (
        attacker.focus <
        stats.focusCap
      ) {
        addLog(
          `${name} — not enough Focus for the Ultimate.`
        );

        return false;
      }

      attacker.focus = 0;

      /*
       * TIME ULTIMATE
       */

      if (attacker.blade === 'Time') {

        let rawTotal = 0;
        let criticalHits = 0;

        for (
          let i = 0;
          i < stats.ultimateHitCount;
          i += 1
        ) {
          const critical =
            Math.random() <
            stats.ultimateCritChance;

          rawTotal += critical
            ? stats.ultimateCritDamagePerHit
            : stats.ultimateDamagePerHit;

          if (critical) {
            criticalHits += 1;
          }
        }

        let damage =
          Math.max(
            1,
            rawTotal - defender.def
          );

        if (defender.isDefending) {
          damage = Math.max(
            1,
            Math.floor(damage * 0.5)
          );
        }

        defender.hp = clamp(
          defender.hp - damage,
          0,
          MAX_HP
        );

        addLog(
          `${name} — ${stats.specialName} deals ${damage} damage (${criticalHits} critical hits).`
        );

        defender.isDefending = false;

        return true;
      }


      /*
       * ELECTRICITY ULTIMATE
       */

      if (
        attacker.blade === 'Electricity'
      ) {
        const damage =
          applyDefense(
            stats.ultimateDamage,
            defender
          );

        defender.hp = clamp(
          defender.hp - damage,
          0,
          MAX_HP
        );

        addLog(
          `${name} — ${stats.specialName} deals ${damage} damage.`
        );

        defender.isDefending = false;

        return true;
      }

      return false;
    }


    /*
     * ============================================================
     * DEFEND
     * ============================================================
     */

    function useDefend(fighter) {
      const stats = getBladeStats(fighter);
      const name = getFighterName(fighter);

      if (
        fighter.blade === 'Time' &&
        fighter.timeDefendLocked
      ) {
        addLog(
          `${name} — Time Defend is unavailable right now.`
        );

        return false;
      }

      if (
        fighter.blade === 'Electricity' &&
        fighter.guaranteedCrits > 0
      ) {
        addLog(
          `${name} — Electricity Defend is unavailable while the critical boost is active.`
        );

        return false;
      }

      fighter.isDefending = true;

      if (fighter.blade === 'Time') {

        fighter.extraTurnCharges = 1;
        fighter.timeDefendLocked = true;

        addLog(
          `${name} — ${stats.defendName}. Damage reduced by 50%; next turn has 2 actions.`
        );
      }

      else if (
        fighter.blade === 'Electricity'
      ) {

        fighter.guaranteedCrits =
          stats.critBoostAttacks;

        addLog(
          `${name} — ${stats.defendName}. Damage reduced by 50%; next 2 attacks are critical.`
        );
      }

      gainFocus(fighter);

      return true;
    }


    /*
     * ============================================================
     * ACTION SYSTEM
     * ============================================================
     */

    function performAction(
      actor,
      target,
      action
    ) {
      if (
        actor.hp <= 0 ||
        target.hp <= 0
      ) {
        return false;
      }

      switch (action) {

        case 'attack':
          normalAttack(
            actor,
            target
          );
          return true;

        case 'defend':
          return useDefend(actor);

        case 'special':
          return useUltimate(
            actor,
            target
          );

        default:
          return false;
      }
    }


    /*
     * ============================================================
     * TURN MANAGEMENT
     * ============================================================
     */

    function beginTurn(fighter) {
      fighter.isDefending = false;

      if (
        fighter.extraTurnCharges > 0
      ) {
        fighter.actionsThisTurn = 2;
        fighter.extraTurnCharges = 0;

        if (
          fighter.blade === 'Time'
        ) {
          addLog(
            `${getFighterName(fighter)} — Time extra turn activated.`
          );
        }
      }
      else {
        fighter.actionsThisTurn = 1;

        if (fighter.timeDefendLocked) {
          fighter.timeDefendLocked = false;
        }
      }
    }


    function endAction(actor) {
      actor.actionsThisTurn =
        Math.max(
          0,
          actor.actionsThisTurn - 1
        );
    }


    /*
     * ============================================================
     * BATTLE END
     * ============================================================
     */

    function checkBattleOver() {

      if (
        state.enemy.hp <= 0
      ) {
        state.enemy.hp = 0;
        state.isBattleOver = true;
        state.phase = 'over';

        setStatus(
          'Victory! The enemy blade is broken.'
        );

        addLog(
          'Battle — You won the battle.'
        );

        updateUi();

        return true;
      }

      if (
        state.player.hp <= 0
      ) {
        state.player.hp = 0;
        state.isBattleOver = true;
        state.phase = 'over';

        setStatus(
          'Defeat. Press New Battle to try again.'
        );

        addLog(
          'Battle — You lost the battle.'
        );

        updateUi();

        return true;
      }

      return false;
    }


    /*
     * ============================================================
     * ENEMY AI
     * ============================================================
     */

    function chooseEnemyAction() {
      const enemy = state.enemy;
      const stats = getBladeStats(enemy);

      if (
        enemy.focus >= stats.focusCap
      ) {
        return 'special';
      }

      if (
        enemy.actionsThisTurn > 1
      ) {
        return 'attack';
      }

      if (
        enemy.blade === 'Time'
      ) {
        if (
          enemy.timeDefendLocked
        ) {
          return 'attack';
        }

        return 'defend';
      }

      if (
        enemy.blade === 'Electricity'
      ) {
        if (
          enemy.guaranteedCrits > 0
        ) {
          return 'attack';
        }

        return 'defend';
      }

      return 'attack';
    }


    async function handleEnemyTurn() {
      if (
        state.isBattleOver
      ) {
        return;
      }

      state.phase = 'enemy';

      beginTurn(state.enemy);

      updateUi();

      await delay(500);

      while (
        state.enemy.actionsThisTurn > 0 &&
        !state.isBattleOver
      ) {

        const action =
          chooseEnemyAction();

        const success =
          performAction(
            state.enemy,
            state.player,
            action
          );

        if (!success) {
          performAction(
            state.enemy,
            state.player,
            'attack'
          );
        }

        endAction(state.enemy);

        updateUi();

        if (
          checkBattleOver()
        ) {
          return;
        }

        if (
          state.enemy.actionsThisTurn > 0
        ) {
          setStatus(
            'Enemy has an extra action.'
          );

          updateUi();

          await delay(500);
        }
      }

      state.turn += 1;
      state.phase = 'player';

      beginTurn(state.player);

      setStatus(
        `Turn ${state.turn} begins. Choose your move.`
      );

      updateUi();
    }


    /*
     * ============================================================
     * PLAYER ACTION
     * ============================================================
     */

    async function handlePlayerAction(action) {
      if (
        state.isBattleOver ||
        state.phase !== 'player'
      ) {
        return;
      }

      const player = state.player;
      const enemy = state.enemy;

      if (
        action === 'special' &&
        player.focus <
          getBladeStats(player).focusCap
      ) {
        setStatus(
          `You need ${getBladeStats(player).focusCap} Focus to use your Ultimate.`
        );

        return;
      }

      if (
        action === 'defend' &&
        player.blade === 'Time' &&
        player.timeDefendLocked
      ) {
        setStatus(
          'Time Defend is unavailable during the current effect.'
        );

        return;
      }

      if (
        action === 'defend' &&
        player.blade === 'Electricity' &&
        player.guaranteedCrits > 0
      ) {
        setStatus(
          'Electricity Defend is unavailable while critical attacks are active.'
        );

        return;
      }

      const success =
        performAction(
          player,
          enemy,
          action
        );

      if (!success) {
        updateUi();
        return;
      }

      endAction(player);

      if (
        checkBattleOver()
      ) {
        return;
      }

      if (
        player.actionsThisTurn > 0
      ) {
        state.phase = 'player';

        setStatus(
          'Extra action available. Choose your next move.'
        );

        updateUi();

        return;
      }

      await handleEnemyTurn();
    }


    /*
     * ============================================================
     * BLADE SWITCHING
     * ============================================================
     */

    function switchPlayerBlade(newBlade) {
      if (
        state.isBattleOver ||
        state.phase !== 'player'
      ) {
        return;
      }

      if (
        !BLADES[newBlade] ||
        newBlade === state.player.blade
      ) {
        return;
      }

      const oldBlade =
        state.player.blade;

      state.player.guaranteedCrits = 0;
      state.player.timeDefendLocked = false;
      state.player.isDefending = false;

      state.player.blade = newBlade;

      bladeButtons.forEach(button => {
        button.classList.toggle(
          'active',
          button.dataset.blade === newBlade
        );
      });

      addLog(
        `Player — switched from ${oldBlade} to ${newBlade}.`
      );

      setStatus(
        `${newBlade} selected. Choose your action.`
      );

      updateUi();
    }


    /*
     * ============================================================
     * UI
     * ============================================================
     */

    function setStatus(message) {
      battleStatusEl.textContent = message;
    }


    function updateActionButtons() {
      const player =
        state.player;

      const disabled =
        state.isBattleOver ||
        state.phase !== 'player';

      actionButtons.forEach(button => {
        const action =
          button.dataset.action;

        let isDisabled = disabled;

        if (
          action === 'defend' &&
          player.blade === 'Time' &&
          player.timeDefendLocked
        ) {
          isDisabled = true;
        }

        if (
          action === 'defend' &&
          player.blade === 'Electricity' &&
          player.guaranteedCrits > 0
        ) {
          isDisabled = true;
        }

        if (
          action === 'special' &&
          player.focus <
            getBladeStats(player).focusCap
        ) {
          isDisabled = true;
        }

        button.disabled = isDisabled;

        if (
          action === 'special'
        ) {
          button.title =
            player.focus >=
            getBladeStats(player).focusCap
              ? 'Ultimate ready'
              : `Requires ${getBladeStats(player).focusCap} Focus`;
        }
      });
    }


    function updateBladeButtons() {
      bladeButtons.forEach(button => {
        button.classList.toggle(
          'active',
          button.dataset.blade ===
            state.player.blade
        );

        button.disabled =
          state.isBattleOver ||
          state.phase !== 'player';
      });
    }


    function updateTurnInfo() {
      if (
        state.isBattleOver
      ) {
        turnInfoEl.textContent =
          'Battle finished';
        return;
      }

      if (
        state.phase === 'enemy'
      ) {
        turnInfoEl.textContent =
          'Enemy turn...';
        return;
      }

      const actions =
        state.player.actionsThisTurn;

      turnInfoEl.textContent =
        `Turn ${state.turn} • ${actions} action${actions === 1 ? '' : 's'} remaining`;
    }


    function updateUi() {
      const player =
        state.player;

      const enemy =
        state.enemy;

      playerHpEl.textContent =
        player.hp;

      playerFocusEl.textContent =
        `${player.focus} / ${getBladeStats(player).focusCap}`;

      enemyHpEl.textContent =
        enemy.hp;

      enemyFocusEl.textContent =
        `${enemy.focus} / ${getBladeStats(enemy).focusCap}`;

      playerBladeEl.textContent =
        `Blade: ${player.blade}`;

      enemyBladeEl.textContent =
        `Blade: ${enemy.blade}`;

      updateActionButtons();
      updateBladeButtons();
      updateTurnInfo();
    }


    /*
     * ============================================================
     * RESET
     * ============================================================
     */

    function resetBattle() {
      state.player =
        createFighter('Time');

      state.enemy =
        createFighter(randomBlade());

      state.turn = 1;
      state.phase = 'player';
      state.isBattleOver = false;
      state.log = [];

      beginTurn(state.player);
      beginTurn(state.enemy);

      addLog(
        `Enemy — chose ${state.enemy.blade} blade.`
      );

      addLog(
        'Battle — A new blade duel begins.'
      );

      setStatus(
        'Choose your blade and move.'
      );

      updateUi();
    }


    /*
     * ============================================================
     * HELPERS
     * ============================================================
     */

    function delay(milliseconds) {
      return new Promise(resolve => {
        setTimeout(
          resolve,
          milliseconds
        );
      });
    }


    /*
     * ============================================================
     * EVENT LISTENERS
     * ============================================================
     */

    bladeButtons.forEach(button => {
      button.addEventListener(
        'click',
        () => {
          switchPlayerBlade(
            button.dataset.blade
          );
        }
      );
    });


    actionButtons.forEach(button => {
      button.addEventListener(
        'click',
        () => {
          handlePlayerAction(
            button.dataset.action
          );
        }
      );
    });


    restartBtn.addEventListener(
      'click',
      resetBattle
    );


    /*
     * ============================================================
     * START
     * ============================================================
     */

    resetBattle();

  </script>

</body>
</html>

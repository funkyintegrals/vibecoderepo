<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElementFight</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0e1220;
      --panel: #171d2d;
      --panel-2: #1d2538;
      --accent: #7c8cff;
      --accent-2: #34d7b7;
      --danger: #ff5f7e;
      --warning: #ffbf69;
      --text: #ffffff;
      --muted: #d0d8f2;
      --border: rgba(255, 255, 255, 0.18);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at top,
          rgba(124, 140, 255, 0.24),
          transparent 30%
        ),
        linear-gradient(180deg, #090d18, var(--bg));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    button {
      font: inherit;
    }

    .game-shell {
      width: min(1000px, 92vw);
      background: rgba(23, 29, 45, 0.96);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      padding: 24px;
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.8rem;
      color: var(--muted);
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
    }

    h2 {
      font-size: 1.35rem;
      line-height: 1.25;
    }

    h3 {
      font-size: 1.05rem;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .secondary,
    .action-button,
    .blade-button {
      border: none;
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      transition:
        transform 0.15s ease,
        filter 0.15s ease,
        opacity 0.15s ease;
    }

    .secondary:hover:not(:disabled),
    .action-button:hover:not(:disabled),
    .blade-button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      padding: 11px 17px;
      min-height: 46px;
      font-weight: 700;
    }

    .battle-area {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 18px;
    }

    .fighter-panel,
    .center-panel {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      min-width: 0;
    }

    .fighter-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .fighter-header h2 {
      margin-bottom: 0;
    }

    .blade-badge {
      background: rgba(124, 140, 255, 0.15);
      border: 1px solid rgba(124, 140, 255, 0.4);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.82rem;
      line-height: 1.3;
      text-align: center;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(80px, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .stats > div {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      min-width: 0;
    }

    .stats span {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 4px;
    }

    .stats strong {
      display: block;
      color: #ffffff;
      font-size: 1.15rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    /*
     * PORTRAIT
     */

    .portrait {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 140px;
      border-radius: 16px;
      font-size: 4rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      overflow: visible;
    }

    /*
     * DAMAGE NUMBERS
     *
     * The animation uses an ease-in curve so the number starts
     * slowly and accelerates as it rises.
     */

    .damage-number {
      position: absolute;
      left: 50%;
      bottom: 25px;

      transform: translateX(-50%);

      color: #ffffff;
      font-size: 2rem;
      font-weight: 900;
      line-height: 1;

      pointer-events: none;
      z-index: 20;

      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.8),
        0 0 10px rgba(255, 95, 126, 0.75);

      animation:
        damageFloat 0.9s
        cubic-bezier(0.65, 0, 1, 0.35)
        forwards;
    }

    .damage-number.critical {
      color: #ffbf69;
      font-size: 2.35rem;

      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.9),
        0 0 14px rgba(255, 191, 105, 0.95);
    }

    @keyframes damageFloat {
      0% {
        opacity: 0;
        transform:
          translate(-50%, 20px)
          scale(0.75);
      }

      15% {
        opacity: 1;
        transform:
          translate(-50%, 10px)
          scale(1);
      }

      100% {
        opacity: 0;
        transform:
          translate(-50%, -115px)
          scale(1.08);
      }
    }

    .center-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .battle-status {
      background: rgba(52, 215, 183, 0.12);
      border: 1px solid rgba(52, 215, 183, 0.5);
      border-radius: 12px;
      padding: 14px 16px;
      min-height: 80px;
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.5;
      white-space: normal;
      overflow-wrap: anywhere;
      overflow: visible;
    }

    .turn-log-wrap {
      margin-top: 18px;
      min-width: 0;
    }

    .battle-log {
      margin: 0;
      padding: 0;
      list-style: none;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;

      min-height: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .battle-log li {
      padding: 9px 11px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9px;

      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
      text-overflow: clip;
      overflow: visible;

      animation: logRollUp 0.25s ease-out;
    }

    @keyframes logRollUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .control-panel {
      margin-top: 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .blade-grid,
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(100px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .blade-button,
    .action-button {
      padding: 13px 14px;
      min-height: 50px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.35;
      font-weight: 700;
    }

    .blade-button.active {
      background: rgba(124, 140, 255, 0.2);
      border-color: rgba(124, 140, 255, 0.6);
    }

    .action-button[data-action="attack"] {
      background: rgba(255, 95, 126, 0.12);
    }

    .action-button[data-action="utility"] {
      background: rgba(52, 215, 183, 0.12);
    }

    .action-button[data-action="special"] {
      background: rgba(255, 191, 105, 0.14);
    }

    /*
     * DILATE MODE
     */

    .action-grid.dilate-mode {
      grid-template-columns: 1fr;
    }

    .action-grid.dilate-mode .dilate-button {
      min-height: 68px;
      font-size: 1.15rem;
      background:
        linear-gradient(
          135deg,
          rgba(124, 140, 255, 0.25),
          rgba(255, 191, 105, 0.2)
        );
      border-color: rgba(255, 191, 105, 0.6);
      box-shadow:
        0 0 20px rgba(124, 140, 255, 0.15);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
      filter: grayscale(0.35);
    }

    button:focus-visible {
      outline: 3px solid rgba(124, 140, 255, 0.75);
      outline-offset: 2px;
    }

    .status-line {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      text-align: center;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .game-shell {
        width: 94vw;
        padding: 20px;
      }

      .battle-area {
        grid-template-columns: 1fr;
      }

      .blade-grid,
      .action-grid {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }

      .title-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .secondary {
        width: 100%;
      }
    }

    @media (max-width: 420px) {
      body {
        font-size: 15px;
      }

      .game-shell {
        width: 96vw;
        padding: 15px;
        border-radius: 16px;
      }

      .fighter-panel,
      .center-panel,
      .control-panel {
        padding: 15px;
        border-radius: 15px;
      }

      .fighter-header {
        flex-direction: column;
        align-items: stretch;
      }

      .blade-badge {
        align-self: flex-start;
      }

      .blade-grid,
      .action-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .blade-button,
      .action-button {
        min-height: 52px;
        padding: 11px 9px;
        font-size: 0.92rem;
      }

      .battle-log {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>

  <main class="game-shell">

    <header class="title-bar">
      <div>
        <p class="eyebrow">Turn-based battle</p>
        <h1>ElementFight</h1>
      </div>

      <button id="restartBtn" class="secondary">
        New Battle
      </button>
    </header>

    <section class="battle-area">

      <!-- PLAYER -->

      <div class="fighter-panel player-panel">

        <div class="fighter-header">
          <h2>Player</h2>

          <span id="playerBlade" class="blade-badge">
            Blade: Time
          </span>
        </div>

        <div class="stats">

          <div>
            <span>HP</span>
            <strong id="playerHp">1000</strong>
          </div>

          <div>
            <span>Focus</span>
            <strong id="playerFocus">0 / 10</strong>
          </div>

        </div>

        <div
          id="playerPortrait"
          class="portrait player-portrait"
        >
          ⚔️
        </div>

      </div>


      <!-- CENTER -->

      <div class="center-panel">

        <div id="battleStatus" class="battle-status">
          Choose your move.
        </div>

        <div class="turn-log-wrap">

          <h3>Battle Log</h3>

          <ul
            id="battleLog"
            class="battle-log"
          ></ul>

        </div>

      </div>


      <!-- ENEMY -->

      <div class="fighter-panel enemy-panel">

        <div class="fighter-header">
          <h2>Enemy</h2>

          <span id="enemyBlade" class="blade-badge">
            Blade: ???
          </span>
        </div>

        <div class="stats">

          <div>
            <span>HP</span>
            <strong id="enemyHp">1000</strong>
          </div>

          <div>
            <span>Focus</span>
            <strong id="enemyFocus">0 / 10</strong>
          </div>

        </div>

        <div
          id="enemyPortrait"
          class="portrait enemy-portrait"
        >
          ⚔️
        </div>

      </div>

    </section>


    <!-- CONTROLS -->

    <section class="control-panel">

      <h3>Choose a blade</h3>

      <div
        class="blade-grid"
        id="bladeGrid"
      >

        <button
          class="blade-button active"
          data-blade="Time"
          type="button"
        >
          Time
        </button>

        <button
          class="blade-button"
          data-blade="Electricity"
          type="button"
        >
          Electricity
        </button>

      </div>


      <p
        id="turnInfo"
        class="status-line"
      >
        Your turn
      </p>


      <h3>Actions</h3>

      <div
        class="action-grid"
        id="actionGrid"
      >

        <button
          class="action-button"
          data-action="attack"
          type="button"
        >
          Attack Skill
        </button>

        <button
          class="action-button"
          data-action="utility"
          type="button"
        >
          Utility
        </button>

        <button
          class="action-button"
          data-action="special"
          type="button"
        >
          Ultimate
        </button>

      </div>

    </section>

  </main>


  <script>
    'use strict';


    /*
     * ============================================================
     * GAME DATA
     * ============================================================
     */

    const MAX_HP = 1000;
    const BASE_DEFENSE = 40;
    const MAX_FOCUS = 10;

    const TIME_ULTIMATE_HITS = 10;

    const BLADES = {

      Time: {

        attackName: 'Chrono Slash',
        utilityName: 'Temporal Guard',
        specialName: 'Age of Stillness',

        attackDamage: 100,

        ultimateHitCount: 10,
        ultimateDamagePerHit: 50,
        ultimateCritDamagePerHit: 100,

        ultimateCritChance: 0.5,

        focusCap: MAX_FOCUS
      },


      Electricity: {

        attackName: 'Volt Arc',
        utilityName: 'Static Impulse',
        specialName: 'Thunderstorm',

        attackDamage: 80,
        critDamage: 160,

        critChance: 0.25,

        /*
         * Utility changes the next two attacks
         * to 100% critical chance.
         */
        guaranteedCritAttacks: 2,

        ultimateDamage: 300,

        focusCap: MAX_FOCUS
      }

    };


    /*
     * ============================================================
     * GAME STATE
     * ============================================================
     */

    function createFighter(blade) {

      return {

        hp: MAX_HP,
        def: BASE_DEFENSE,
        focus: 0,

        blade,

        isDefending: false,

        /*
         * Number of actions available in the current turn.
         */
        actionsThisTurn: 1,

        /*
         * Time Utility puts the NEXT turn into
         * a double-turn state.
         */
        timeDoubleTurnPending: false,

        /*
         * True while the current Time double turn is active.
         * Utility is disabled during this state.
         */
        timeDoubleTurnActive: false,

        /*
         * Electricity Utility:
         * number of future attacks guaranteed to crit.
         */
        guaranteedCrits: 0,

        /*
         * Time ultimate state.
         */
        timeUltimateActive: false,
        timeUltimateHitsRemaining: 0

      };
    }


    const state = {

      player: createFighter('Time'),

      enemy: createFighter('Electricity'),

      turn: 1,

      phase: 'player',

      isBattleOver: false,

      log: []

    };


    /*
     * ============================================================
     * DOM
     * ============================================================
     */

    const playerHpEl =
      document.getElementById('playerHp');

    const playerFocusEl =
      document.getElementById('playerFocus');

    const enemyHpEl =
      document.getElementById('enemyHp');

    const enemyFocusEl =
      document.getElementById('enemyFocus');

    const playerBladeEl =
      document.getElementById('playerBlade');

    const enemyBladeEl =
      document.getElementById('enemyBlade');

    const battleStatusEl =
      document.getElementById('battleStatus');

    const battleLogEl =
      document.getElementById('battleLog');

    const restartBtn =
      document.getElementById('restartBtn');

    const turnInfoEl =
      document.getElementById('turnInfo');

    const bladeButtons =
      [...document.querySelectorAll('.blade-button')];

    const actionGrid =
      document.getElementById('actionGrid');

    const playerPortrait =
      document.getElementById('playerPortrait');

    const enemyPortrait =
      document.getElementById('enemyPortrait');


    /*
     * ============================================================
     * LOGGING
     * ============================================================
     */

    function addLog(message) {

      state.log.unshift(message);

      if (state.log.length > 2) {
        state.log.length = 2;
      }

      renderLog();
    }


    function renderLog() {

      battleLogEl.replaceChildren();

      state.log
        .slice()
        .reverse()
        .forEach(message => {

          const li =
            document.createElement('li');

          li.textContent = message;

          battleLogEl.appendChild(li);

        });
    }


    /*
     * ============================================================
     * UTILITIES
     * ============================================================
     */

    function clamp(value, min, max) {

      return Math.min(
        Math.max(value, min),
        max
      );

    }


    function randomBlade() {

      const blades =
        Object.keys(BLADES);

      return blades[
        Math.floor(
          Math.random() * blades.length
        )
      ];

    }


    function getFighterName(fighter) {

      return fighter === state.player
        ? 'Player'
        : 'Enemy';

    }


    function getBladeStats(fighter) {

      return BLADES[fighter.blade];

    }


    /*
     * ============================================================
     * DAMAGE NUMBERS
     * ============================================================
     */

    function showDamageNumber(
      defender,
      damage,
      critical = false
    ) {

      const portrait =
        defender === state.player
          ? playerPortrait
          : enemyPortrait;

      const number =
        document.createElement('div');

      number.className =
        'damage-number';

      if (critical) {
        number.classList.add('critical');
      }

      /*
       * The displayed number is exactly the damage
       * actually removed from HP.
       */
      number.textContent = damage;

      /*
       * Small horizontal variation prevents every hit
       * from appearing in exactly the same place.
       */
      const horizontalOffset =
        (Math.random() * 50) - 25;

      number.style.marginLeft =
        `${horizontalOffset}px`;

      portrait.appendChild(number);

      number.addEventListener(
        'animationend',
        () => {
          number.remove();
        },
        { once: true }
      );

    }


    /*
     * ============================================================
     * FOCUS
     * ============================================================
     */

    function gainFocus(
      fighter,
      amount = 1
    ) {

      const stats =
        getBladeStats(fighter);

      fighter.focus =
        clamp(
          fighter.focus + amount,
          0,
          stats.focusCap
        );

    }


    /*
     * ============================================================
     * DAMAGE
     * ============================================================
     */

    function applyDefense(
      damage,
      defender
    ) {

      let finalDamage =
        Math.max(
          1,
          damage - defender.def
        );

      if (defender.isDefending) {

        finalDamage =
          Math.max(
            1,
            Math.floor(
              finalDamage * 0.5
            )
          );

      }

      return finalDamage;
    }


    /*
     * ============================================================
     * NORMAL ATTACK
     * ============================================================
     */

    function normalAttack(
      attacker,
      defender
    ) {

      const stats =
        getBladeStats(attacker);

      let rawDamage =
        stats.attackDamage;

      let critical = false;


      /*
       * ELECTRICITY CRITICAL SYSTEM
       *
       * Utility gives guaranteedCrits = 2.
       * Those attacks are always critical.
       *
       * Otherwise the normal 25% critical chance applies.
       */

      if (
        attacker.blade === 'Electricity'
      ) {

        if (
          attacker.guaranteedCrits > 0
        ) {

          critical = true;

          attacker.guaranteedCrits -= 1;

        }

        else if (
          Math.random() <
          stats.critChance
        ) {

          critical = true;

        }

        if (critical) {
          rawDamage =
            stats.critDamage;
        }

      }


      const damage =
        applyDefense(
          rawDamage,
          defender
        );


      defender.hp =
        clamp(
          defender.hp - damage,
          0,
          MAX_HP
        );


      const name =
        getFighterName(attacker);

      const criticalText =
        critical
          ? ' CRITICAL!'
          : '';


      addLog(
        `${name} — ${stats.attackName} deals ${damage} damage.${criticalText}`
      );


      showDamageNumber(
        defender,
        damage,
        critical
      );


      gainFocus(attacker);

      /*
       * A successful attack ends the defender's current guard.
       */
      defender.isDefending = false;

      return damage;

    }


    /*
     * ============================================================
     * TIME ULTIMATE
     * ============================================================
     *
     * The Ultimate no longer executes all 10 hits instantly.
     *
     * Activating it:
     *   - consumes 10 Focus
     *   - enters Dilation mode
     *   - exposes the Dilate button
     *
     * Each Dilate click:
     *   - performs one hit
     *   - displays its damage
     *   - reduces remaining hits
     *
     * After hit 10:
     *   - Dilation ends
     *   - enemy turn begins
     */

    function beginTimeUltimate() {

      const attacker =
        state.player;

      const defender =
        state.enemy;

      const stats =
        getBladeStats(attacker);

      if (
        attacker.focus <
        stats.focusCap
      ) {

        addLog(
          'Player — not enough Focus for the Ultimate.'
        );

        return false;

      }


      /*
       * Consume Focus immediately.
       */
      attacker.focus = 0;


      attacker.timeUltimateActive = true;

      attacker.timeUltimateHitsRemaining =
        TIME_ULTIMATE_HITS;


      /*
       * The Time Ultimate owns the entire
       * remainder of this turn.
       */
      state.phase = 'player';


      addLog(
        'Player — Age of Stillness begins. Dilate time 10 times.'
      );


      setStatus(
        'Dilation active. Press Dilate to strike.'
      );


      updateUi();

      return true;
    }


    function performTimeDilate() {

      const attacker =
        state.player;

      const defender =
        state.enemy;


      if (
        !attacker.timeUltimateActive ||
        state.isBattleOver
      ) {
        return;
      }


      const stats =
        getBladeStats(attacker);


      let critical = false;


      /*
       * Each of the ten hits gets its own
       * independent 50% critical roll.
       */
      critical =
        Math.random() <
        stats.ultimateCritChance;


      const rawDamage =
        critical
          ? stats.ultimateCritDamagePerHit
          : stats.ultimateDamagePerHit;


      const damage =
        applyDefense(
          rawDamage,
          defender
        );


      defender.hp =
        clamp(
          defender.hp - damage,
          0,
          MAX_HP
        );


      attacker.timeUltimateHitsRemaining -= 1;


      const hitNumber =
        TIME_ULTIMATE_HITS -
        attacker.timeUltimateHitsRemaining;


      const criticalText =
        critical
          ? ' CRITICAL!'
          : '';


      addLog(
        `Player — Dilate ${hitNumber}/${TIME_ULTIMATE_HITS} deals ${damage} damage.${criticalText}`
      );


      showDamageNumber(
        defender,
        damage,
        critical
      );


      defender.isDefending = false;


      updateUi();


      /*
       * Check for victory before allowing
       * another Dilate click.
       */
      if (
        checkBattleOver()
      ) {
        return;
      }


      /*
       * All ten hits have now happened.
       */
      if (
        attacker.timeUltimateHitsRemaining <= 0
      ) {

        attacker.timeUltimateActive = false;

        addLog(
          'Player — Age of Stillness ends.'
        );


        setStatus(
          'Dilation complete.'
        );


        updateUi();


        /*
         * The Time Ultimate consumes the player's
         * turn, so the enemy now acts.
         */
        handleEnemyTurn();

        return;
      }


      setStatus(
        `Dilation active — ${attacker.timeUltimateHitsRemaining} hit${attacker.timeUltimateHitsRemaining === 1 ? '' : 's'} remaining.`
      );

      updateUi();

    }


    /*
     * ============================================================
     * ULTIMATE
     * ============================================================
     */

    function useUltimate(
      attacker,
      defender
    ) {

      const stats =
        getBladeStats(attacker);

      const name =
        getFighterName(attacker);


      if (
        attacker.focus <
        stats.focusCap
      ) {

        addLog(
          `${name} — not enough Focus for the Ultimate.`
        );

        return false;
      }


      /*
       * TIME
       *
       * Do not resolve the Ultimate here.
       * Enter the 10-click Dilation sequence instead.
       */
      if (
        attacker.blade === 'Time'
      ) {

        return beginTimeUltimate();

      }


      /*
       * ELECTRICITY
       *
       * Electricity still has its instant Ultimate.
       */

      if (
        attacker.blade === 'Electricity'
      ) {

        attacker.focus = 0;


        const damage =
          applyDefense(
            stats.ultimateDamage,
            defender
          );


        defender.hp =
          clamp(
            defender.hp - damage,
            0,
            MAX_HP
          );


        addLog(
          `${name} — ${stats.specialName} deals ${damage} damage.`
        );


        showDamageNumber(
          defender,
          damage
        );


        defender.isDefending = false;

        return true;

      }


      return false;

    }


    /*
     * ============================================================
     * UTILITY
     * ============================================================
     */

    function useUtility(fighter) {

      const stats =
        getBladeStats(fighter);

      const name =
        getFighterName(fighter);


      /*
       * TIME UTILITY
       *
       * Next turn:
       *   - 2 actions
       *   - Attack can therefore be used twice
       *   - Utility is disabled
       */
      if (
        fighter.blade === 'Time'
      ) {

        if (
          fighter.timeDoubleTurnPending ||
          fighter.timeDoubleTurnActive
        ) {

          addLog(
            `${name} — Temporal Guard is already active.`
          );

          return false;

        }


        fighter.isDefending = true;

        fighter.timeDoubleTurnPending = true;

        addLog(
          `${name} — ${stats.utilityName}. Next turn is a double turn: Attack can be used twice.`
        );


        gainFocus(fighter);

        return true;
      }


      /*
       * ELECTRICITY UTILITY
       *
       * The next two attacks have exactly
       * 100% critical chance.
       */
      if (
        fighter.blade === 'Electricity'
      ) {

        if (
          fighter.guaranteedCrits > 0
        ) {

          addLog(
            `${name} — Static Impulse is already active.`
          );

          return false;

        }


        fighter.isDefending = true;

        fighter.guaranteedCrits =
          stats.guaranteedCritAttacks;


        addLog(
          `${name} — ${stats.utilityName}. The next ${stats.guaranteedCritAttacks} attacks have 100% critical chance.`
        );


        gainFocus(fighter);

        return true;

      }


      return false;
    }


    /*
     * ============================================================
     * ACTION SYSTEM
     * ============================================================
     */

    function performAction(
      actor,
      target,
      action
    ) {

      if (
        actor.hp <= 0 ||
        target.hp <= 0
      ) {

        return false;

      }


      switch (action) {

        case 'attack':

          normalAttack(
            actor,
            target
          );

          return true;


        case 'utility':

          return useUtility(actor);


        case 'special':

          return useUltimate(
            actor,
            target
          );


        default:

          return false;

      }

    }


    /*
     * ============================================================
     * TURN MANAGEMENT
     * ============================================================
     */

    function beginTurn(fighter) {

      fighter.isDefending = false;


      /*
       * A Time Utility was activated on the
       * previous turn.
       */
      if (
        fighter.timeDoubleTurnPending
      ) {

        fighter.timeDoubleTurnPending = false;

        fighter.timeDoubleTurnActive = true;

        fighter.actionsThisTurn = 2;


        addLog(
          `${getFighterName(fighter)} — Time double turn activated.`
        );

        return;
      }


      /*
       * The current double turn has ended.
       */
      if (
        fighter.timeDoubleTurnActive
      ) {

        fighter.timeDoubleTurnActive = false;

      }


      fighter.actionsThisTurn = 1;

    }


    function endAction(actor) {

      actor.actionsThisTurn =
        Math.max(
          0,
          actor.actionsThisTurn - 1
        );

    }


    /*
     * ============================================================
     * BATTLE END
     * ============================================================
     */

    function checkBattleOver() {

      if (
        state.enemy.hp <= 0
      ) {

        state.enemy.hp = 0;

        state.isBattleOver = true;

        state.phase = 'over';


        state.player.timeUltimateActive = false;


        setStatus(
          'Victory! The enemy blade is broken.'
        );


        addLog(
          'Battle — You won the battle.'
        );


        updateUi();

        return true;

      }


      if (
        state.player.hp <= 0
      ) {

        state.player.hp = 0;

        state.isBattleOver = true;

        state.phase = 'over';


        state.player.timeUltimateActive = false;


        setStatus(
          'Defeat. Press New Battle to try again.'
        );


        addLog(
          'Battle — You lost the battle.'
        );


        updateUi();

        return true;

      }


      return false;

    }


    /*
     * ============================================================
     * ENEMY AI
     * ============================================================
     */

    function chooseEnemyAction() {

      const enemy =
        state.enemy;

      const stats =
        getBladeStats(enemy);


      /*
       * Ultimate always takes priority.
       */
      if (
        enemy.focus >=
        stats.focusCap
      ) {

        return 'special';

      }


      /*
       * If Time has a double action,
       * use Attack for both actions.
       */
      if (
        enemy.actionsThisTurn > 1
      ) {

        return 'attack';

      }


      /*
       * TIME
       */

      if (
        enemy.blade === 'Time'
      ) {

        if (
          enemy.timeDoubleTurnPending ||
          enemy.timeDoubleTurnActive
        ) {

          return 'attack';

        }

        return 'utility';

      }


      /*
       * ELECTRICITY
       */

      if (
        enemy.blade === 'Electricity'
      ) {

        if (
          enemy.guaranteedCrits > 0
        ) {

          return 'attack';

        }

        return 'utility';

      }


      return 'attack';

    }


    async function handleEnemyTurn() {

      if (
        state.isBattleOver
      ) {

        return;

      }


      state.phase = 'enemy';


      beginTurn(state.enemy);


      updateUi();


      await delay(500);


      while (
        state.enemy.actionsThisTurn > 0 &&
        !state.isBattleOver
      ) {

        const action =
          chooseEnemyAction();


        const success =
          performAction(
            state.enemy,
            state.player,
            action
          );


        if (!success) {

          /*
           * If Utility was somehow unavailable,
           * fall back to an attack.
           */
          performAction(
            state.enemy,
            state.player,
            'attack'
          );

        }


        endAction(state.enemy);


        updateUi();


        if (
          checkBattleOver()
        ) {

          return;

        }


        if (
          state.enemy.actionsThisTurn > 0
        ) {

          setStatus(
            'Enemy has an extra action.'
          );


          updateUi();


          await delay(500);

        }

      }


      state.turn += 1;

      state.phase = 'player';


      beginTurn(state.player);


      setStatus(
        `Turn ${state.turn} begins. Choose your move.`
      );


      updateUi();

    }


    /*
     * ============================================================
     * PLAYER ACTION
     * ============================================================
     */

    async function handlePlayerAction(action) {

      if (
        state.isBattleOver ||
        state.phase !== 'player'
      ) {

        return;

      }


      /*
       * Time Dilation has its own dedicated handler.
       */
      if (
        state.player.timeUltimateActive
      ) {

        if (
          action === 'dilate'
        ) {

          performTimeDilate();

        }

        return;

      }


      const player =
        state.player;

      const enemy =
        state.enemy;


      /*
       * Ultimate Focus requirement.
       */
      if (
        action === 'special' &&
        player.focus <
          getBladeStats(player).focusCap
      ) {

        setStatus(
          `You need ${getBladeStats(player).focusCap} Focus to use your Ultimate.`
        );

        return;

      }


      /*
       * Time Utility is unavailable during
       * the double turn.
       */
      if (
        action === 'utility' &&
        player.blade === 'Time' &&
        player.timeDoubleTurnActive
      ) {

        setStatus(
          'Time Utility is disabled during the double turn.'
        );

        return;

      }


      /*
       * Electricity Utility is unavailable while
       * its two guaranteed critical attacks remain.
       */
      if (
        action === 'utility' &&
        player.blade === 'Electricity' &&
        player.guaranteedCrits > 0
      ) {

        setStatus(
          'Electricity Utility is unavailable while the 100% critical boost is active.'
        );

        return;

      }


      const success =
        performAction(
          player,
          enemy,
          action
        );


      if (!success) {

        updateUi();

        return;

      }


      /*
       * Starting Time's Ultimate is special:
       * it doesn't consume a normal action because
       * Dilation now controls the rest of the turn.
       */
      if (
        action === 'special' &&
        player.blade === 'Time'
      ) {

        updateUi();

        return;

      }


      endAction(player);


      if (
        checkBattleOver()
      ) {

        return;

      }


      /*
       * Double turn still has another action.
       */
      if (
        player.actionsThisTurn > 0
      ) {

        state.phase = 'player';


        setStatus(
          'Extra action available. Choose your next move.'
        );


        updateUi();

        return;

      }


      await handleEnemyTurn();

    }


    /*
     * ============================================================
     * BLADE SWITCHING
     * ============================================================
     */

    function switchPlayerBlade(newBlade) {

      if (
        state.isBattleOver ||
        state.phase !== 'player' ||
        state.player.timeUltimateActive
      ) {

        return;

      }


      if (
        !BLADES[newBlade] ||
        newBlade === state.player.blade
      ) {

        return;

      }


      const oldBlade =
        state.player.blade;


      /*
       * Switching blade removes temporary blade-specific
       * effects from the old blade.
       */
      state.player.guaranteedCrits = 0;

      state.player.timeDoubleTurnPending = false;

      state.player.timeDoubleTurnActive = false;

      state.player.isDefending = false;


      state.player.blade =
        newBlade;


      bladeButtons.forEach(button => {

        button.classList.toggle(
          'active',
          button.dataset.blade === newBlade
        );

      });


      addLog(
        `Player — switched from ${oldBlade} to ${newBlade}.`
      );


      setStatus(
        `${newBlade} selected. Choose your action.`
      );


      updateUi();

    }


    /*
     * ============================================================
     * UI
     * ============================================================
     */

    function setStatus(message) {

      battleStatusEl.textContent =
        message;

    }


    /*
     * Build the action buttons dynamically.
     *
     * During Time Ultimate:
     *
     *     [ Dilate ]
     *
     * replaces:
     *
     *     [ Attack ] [ Utility ] [ Ultimate ]
     */

    function renderActionButtons() {

      actionGrid.replaceChildren();


      /*
       * TIME DILATION MODE
       */

      if (
        state.player.timeUltimateActive
      ) {

        actionGrid.classList.add(
          'dilate-mode'
        );


        const button =
          document.createElement('button');


        button.type = 'button';

        button.className =
          'action-button dilate-button';

        button.dataset.action =
          'dilate';


        button.textContent =
          `Dilate (${state.player.timeUltimateHitsRemaining})`;


        button.addEventListener(
          'click',
          () => {
            handlePlayerAction('dilate');
          }
        );


        actionGrid.appendChild(button);

        return;

      }


      actionGrid.classList.remove(
        'dilate-mode'
      );


      /*
       * NORMAL ACTION MODE
       */

      const actions = [
        {
          action: 'attack',
          label: 'Attack Skill'
        },
        {
          action: 'utility',
          label: 'Utility'
        },
        {
          action: 'special',
          label: 'Ultimate'
        }
      ];


      actions.forEach(item => {

        const button =
          document.createElement('button');


        button.type = 'button';

        button.className =
          'action-button';

        button.dataset.action =
          item.action;

        button.textContent =
          item.label;


        if (
          item.action === 'attack'
        ) {

          button.style.background =
            'rgba(255, 95, 126, 0.12)';

        }


        if (
          item.action === 'utility'
        ) {

          button.style.background =
            'rgba(52, 215, 183, 0.12)';

        }


        if (
          item.action === 'special'
        ) {

          button.style.background =
            'rgba(255, 191, 105, 0.14)';

        }


        button.addEventListener(
          'click',
          () => {

            handlePlayerAction(
              item.action
            );

          }
        );


        actionGrid.appendChild(button);

      });

    }


    function updateActionButtons() {

      /*
       * Dilation owns the controls.
       */
      if (
        state.player.timeUltimateActive
      ) {

        renderActionButtons();

        return;

      }


      renderActionButtons();


      const player =
        state.player;


      const disabled =
        state.isBattleOver ||
        state.phase !== 'player';


      const buttons =
        [...actionGrid.querySelectorAll('.action-button')];


      buttons.forEach(button => {

        const action =
          button.dataset.action;


        let isDisabled =
          disabled;


        /*
         * Time Utility:
         * unavailable during the double turn.
         */
        if (
          action === 'utility' &&
          player.blade === 'Time' &&
          player.timeDoubleTurnActive
        ) {

          isDisabled = true;

          button.title =
            'Utility is disabled during the Time double turn.';

        }


        /*
         * Electricity Utility:
         * unavailable while guaranteed crits remain.
         */
        if (
          action === 'utility' &&
          player.blade === 'Electricity' &&
          player.guaranteedCrits > 0
        ) {

          isDisabled = true;

          button.title =
            'Utility is unavailable while the 100% critical boost is active.';

        }


        /*
         * Ultimate.
         */
        if (
          action === 'special' &&
          player.focus <
            getBladeStats(player).focusCap
        ) {

          isDisabled = true;

          button.title =
            `Requires ${getBladeStats(player).focusCap} Focus`;

        }


        button.disabled =
          isDisabled;

      });

    }


    function updateBladeButtons() {

      bladeButtons.forEach(button => {

        button.classList.toggle(
          'active',
          button.dataset.blade ===
            state.player.blade
        );


        /*
         * Blade switching is disabled during
         * Dilation as well as enemy turns.
         */
        button.disabled =
          state.isBattleOver ||
          state.phase !== 'player' ||
          state.player.timeUltimateActive;

      });

    }


    function updateTurnInfo() {

      if (
        state.isBattleOver
      ) {

        turnInfoEl.textContent =
          'Battle finished';

        return;

      }


      if (
        state.player.timeUltimateActive
      ) {

        turnInfoEl.textContent =
          `Time Dilation • ${state.player.timeUltimateHitsRemaining} hits remaining`;

        return;

      }


      if (
        state.phase === 'enemy'
      ) {

        turnInfoEl.textContent =
          'Enemy turn...';

        return;

      }


      const actions =
        state.player.actionsThisTurn;


      let text =
        `Turn ${state.turn} • ${actions} action${actions === 1 ? '' : 's'} remaining`;


      if (
        state.player.timeDoubleTurnActive
      ) {

        text +=
          ' • Double Turn';

      }


      turnInfoEl.textContent =
        text;

    }


    function updateUi() {

      const player =
        state.player;

      const enemy =
        state.enemy;


      playerHpEl.textContent =
        player.hp;


      playerFocusEl.textContent =
        `${player.focus} / ${getBladeStats(player).focusCap}`;


      enemyHpEl.textContent =
        enemy.hp;


      enemyFocusEl.textContent =
        `${enemy.focus} / ${getBladeStats(enemy).focusCap}`;


      playerBladeEl.textContent =
        `Blade: ${player.blade}`;


      enemyBladeEl.textContent =
        `Blade: ${enemy.blade}`;


      updateActionButtons();

      updateBladeButtons();

      updateTurnInfo();

    }


    /*
     * ============================================================
     * RESET
     * ============================================================
     */

    function resetBattle() {

      state.player =
        createFighter('Time');


      state.enemy =
        createFighter(
          randomBlade()
        );


      state.turn = 1;

      state.phase = 'player';

      state.isBattleOver = false;

      state.log = [];


      /*
       * Both fighters begin their first normal turn.
       */
      beginTurn(state.player);

      beginTurn(state.enemy);


      addLog(
        `Enemy — chose ${state.enemy.blade} blade.`
      );


      addLog(
        'Battle — A new blade duel begins.'
      );


      setStatus(
        'Choose your blade and move.'
      );


      updateUi();

    }


    /*
     * ============================================================
     * HELPERS
     * ============================================================
     */

    function delay(milliseconds) {

      return new Promise(resolve => {

        setTimeout(
          resolve,
          milliseconds
        );

      });

    }


    /*
     * ============================================================
     * EVENT LISTENERS
     * ============================================================
     */

    bladeButtons.forEach(button => {

      button.addEventListener(
        'click',
        () => {

          switchPlayerBlade(
            button.dataset.blade
          );

        }
      );

    });


    restartBtn.addEventListener(
      'click',
      resetBattle
    );


    /*
     * ============================================================
     * START
     * ============================================================
     */

    resetBattle();

  </script>

</body>
</html>

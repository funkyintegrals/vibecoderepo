<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElementFight</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="title-bar">
        <div>
          <p class="eyebrow">Turn-based battle</p>
          <h1>ElementFight</h1>
        </div>
        <button id="restartBtn" class="secondary">New Battle</button>
      </header>

      <section class="battle-area">
        <div class="fighter-panel enemy-panel">
          <div class="fighter-header">
            <h2>Enemy</h2>
            <span id="enemyBlade" class="blade-badge">Blade: ???</span>
          </div>
          <div class="stats">
            <div><span>HP</span><strong id="enemyHp">100</strong></div>
            <div><span>Focus</span><strong id="enemyFocus">10</strong></div>
          </div>
          <div class="portrait enemy-portrait">⚔️</div>
        </div>

        <div class="center-panel">
          <div id="battleStatus" class="battle-status">Choose your move.</div>
          <div class="turn-log-wrap">
            <h3>Battle Log</h3>
            <ul id="battleLog" class="battle-log"></ul>
          </div>
        </div>

        <div class="fighter-panel player-panel">
          <div class="fighter-header">
            <h2>Player</h2>
            <span id="playerBlade" class="blade-badge">Blade: Time</span>
          </div>
          <div class="stats">
            <div><span>HP</span><strong id="playerHp">100</strong></div>
            <div><span>Focus</span><strong id="playerFocus">10</strong></div>
          </div>
          <div class="portrait player-portrait">🛡️</div>
        </div>
      </section>

      <section class="control-panel">
        <h3>Choose a blade</h3>
        <div class="blade-grid" id="bladeGrid">
          <button class="blade-button active" data-blade="Time">Time</button>
          <button class="blade-button" data-blade="Electricity">Electricity</button>
        </div>

        <h3>Actions</h3>
        <div class="action-grid">
          <button class="action-button" data-action="attack">Attack Skill</button>
          <button class="action-button" data-action="defend">Defend Skill</button>
          <button class="action-button" data-action="special">Ultimate</button>
          <button class="action-button" data-action="heal">Recover</button>
        </div>
      </section>
    </main>

    <script src="elementfight/script.js"></script>
  </body>
</html>

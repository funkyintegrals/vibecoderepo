<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElementFight</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="title-bar">
        <div>
          <p class="eyebrow">Turn-based battle</p>
          <h1>ElementFight</h1>
        </div>
        <button id="restartBtn" class="secondary">New Battle</button>
      </header>

      <section class="battle-area">
        <div class="fighter-panel enemy-panel">
          <div class="fighter-header">
            <h2>Enemy</h2>
            <span id="enemyElement" class="element-badge">Element: ???</span>
          </div>
          <div class="stats">
            <div><span>HP</span><strong id="enemyHp">100</strong></div>
            <div><span>Mana</span><strong id="enemyMana">10</strong></div>
          </div>
          <div class="portrait enemy-portrait">⚔️</div>
        </div>

        <div class="center-panel">
          <div id="battleStatus" class="battle-status">Choose your move.</div>
          <div class="turn-log-wrap">
            <h3>Battle Log</h3>
            <ul id="battleLog" class="battle-log"></ul>
          </div>
        </div>

        <div class="fighter-panel player-panel">
          <div class="fighter-header">
            <h2>Player</h2>
            <span id="playerElement" class="element-badge">Element: Fire</span>
          </div>
          <div class="stats">
            <div><span>HP</span><strong id="playerHp">100</strong></div>
            <div><span>Mana</span><strong id="playerMana">10</strong></div>
          </div>
          <div class="portrait player-portrait">🛡️</div>
        </div>
      </section>

      <section class="control-panel">
        <h3>Choose an element</h3>
        <div class="element-grid" id="elementGrid">
          <button class="element-button active" data-element="Fire">Fire</button>
          <button class="element-button" data-element="Water">Water</button>
          <button class="element-button" data-element="Earth">Earth</button>
          <button class="element-button" data-element="Air">Air</button>
        </div>

        <h3>Actions</h3>
        <div class="action-grid">
          <button class="action-button" data-action="attack">Attack</button>
          <button class="action-button" data-action="defend">Defend</button>
          <button class="action-button" data-action="special">Special</button>
          <button class="action-button" data-action="heal">Heal</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ElementFight</title>

  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

  <main class="game-shell">

    <header class="title-bar">
      <div>
        <p class="eyebrow">Turn-based battle</p>
        <h1>ElementFight</h1>
      </div>

      <button id="restartBtn" class="secondary">
        New Battle
      </button>
    </header>

    <section class="battle-area">

      <!-- PLAYER -->

      <div class="fighter-panel">

        <div class="fighter-header">
          <h2>Player</h2>

          <span id="playerBlade" class="blade-badge">
            Blade: Time
          </span>
        </div>

        <div class="stats">

          <div>
            <span>HP</span>
            <strong id="playerHp">1000</strong>
          </div>

          <div>
            <span>Focus</span>
            <strong id="playerFocus">0 / 10</strong>
          </div>

        </div>

        <div id="playerPortrait" class="portrait">
          ⚔️
        </div>

      </div>


      <!-- CENTER -->

      <div class="center-panel">

        <div id="battleStatus" class="battle-status">
          Choose your move.
        </div>

        <div class="turn-log-wrap">

          <h3>Battle Log</h3>

          <ul id="battleLog" class="battle-log"></ul>

        </div>

      </div>


      <!-- ENEMY -->

      <div class="fighter-panel">

        <div class="fighter-header">
          <h2>Enemy</h2>

          <span id="enemyBlade" class="blade-badge">
            Blade: ???
          </span>
        </div>

        <div class="stats">

          <div>
            <span>HP</span>
            <strong id="enemyHp">1000</strong>
          </div>

          <div>
            <span>Focus</span>
            <strong id="enemyFocus">0 / 10</strong>
          </div>

        </div>

        <div id="enemyPortrait" class="portrait">
          ⚔️
        </div>

      </div>

    </section>


    <!-- CONTROLS -->

    <section class="control-panel">

      <h3>Choose a blade</h3>

      <div class="blade-grid" id="bladeGrid">

        <button
          class="blade-button active"
          data-blade="Time"
          type="button"
        >
          Time
        </button>

        <button
          class="blade-button"
          data-blade="Electricity"
          type="button"
        >
          Electricity
        </button>

      </div>


      <p id="turnInfo" class="status-line">
        Your turn
      </p>


      <h3>Actions</h3>

      <div id="actionGrid" class="action-grid"></div>

    </section>

  </main>


  <script type="module" src="/js/main.js"></script>

</body>
</html>
